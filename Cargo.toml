[package]
name = "mortgage-calculator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/main.rs"
required-features = ["server"]

[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "web-sys", "wasm-bindgen-futures"]
server = ["axum", "tokio", "tower", "tower-http", "sqlx", "chrono", "uuid", "utoipa", "utoipa-swagger-ui"]

[dependencies]
# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WASM dependencies
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "Response", "Window"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Server dependencies
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", features = ["fs", "cors"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
utoipa = { version = "4", features = ["axum_extras", "chrono"], optional = true }
utoipa-swagger-ui = { version = "5", features = ["axum"], optional = true }
